[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superchat"
version = "0.1.0"
description = "Capture decisions from Claude chats as shared, company-tagged team knowledge (KT)."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28,<2",          # 2.x renamed FastMCP and breaks the API
  "httpx>=0.27",
  "filelock>=3.13",
  "pydantic>=2.7",
  "fastembed>=0.4",
  "psycopg[binary]>=3.1",     # only used by `superchat admin` (owner database setup)
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
superchat = "superchat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superchat = ["defaults.json", "instructions.md", "assets/claude-code/skills/*/SKILL.md", "assets/review/template.html", "assets/supabase/setup.sql"]
